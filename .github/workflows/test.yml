name: Run tests  #name of the workflow

on: 
    workflow_dispatch:  #allows to run the workflow manually from the GitHub Actions tab
    pull_request:
        branches: [ 'main' ]


jobs:

  job1:
    name: Run tests as Job1

    runs-on: ubuntu-latest

    steps:
        - name: Checkout code   #get the code from the repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'

        - name: Install dependencies
          run: |
                python -m pip install --upgrade pip
                pip install pytest
        - name: Run tests
          run: |
                pytest test.py
                
  job2:

    name: Run tests as Job2
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code   #get the code from the repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'

        - name: Install dependencies
          run: |
                python -m pip install --upgrade pip
                pip install pytest
        - name: Run tests
          run: |
                pytest test.py